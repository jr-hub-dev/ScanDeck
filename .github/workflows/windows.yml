name: Windows zip

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: python -m pip install --upgrade pip pyinstaller openpyxl

      - name: Build
        run: python -m PyInstaller --noconfirm ScanDeck.spec

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\ScanDeck -DestinationPath ScanDeck-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ScanDeck-windows
          path: ScanDeck-windows.zip

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ScanDeck-windows.zip
          generate_release_notes: false
          body: |
            Changelog: https://github.com/jr-hub-dev/ScanDeck/blob/main/CHANGELOG.md
            Français: https://github.com/jr-hub-dev/ScanDeck/blob/main/CHANGELOG.fr.md
            Español: https://github.com/jr-hub-dev/ScanDeck/blob/main/CHANGELOG.es.md

            Unzip and run `ScanDeck.exe`. Keep the whole folder together.
            Windows SmartScreen may warn on the first launch: More info → Run anyway.
